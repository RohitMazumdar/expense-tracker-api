spring.application.name=expense-tracker

# --- Database (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/expense_tracker
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# 'update' creates/updates tables automatically. Fine for learning; real projects use Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# We map entities to DTOs inside the service transaction, so we don't need the session open in the web layer.
spring.jpa.open-in-view=false

# --- Swagger UI: http://localhost:8080/swagger-ui/index.html ---
